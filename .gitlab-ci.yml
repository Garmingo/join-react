image: node:20-bullseye

variables:
  PNPM_HOME: "/root/.local/share/pnpm"
  PNPM_STORE_PATH: "$CI_PROJECT_DIR/.pnpm-store"

stages:
  - test
  - publish

cache:
  key: "pnpm-$CI_COMMIT_REF_SLUG"
  paths:
    - .pnpm-store
    - node_modules

before_script:
  - corepack enable
  - pnpm config set store-dir .pnpm-store
  - pnpm config set //${CI_SERVER_HOST}/api/v4/packages/npm/:_authToken ${NPM_TOKEN}
  - pnpm config set //${CI_SERVER_HOST}/api/v4/projects/:_authToken ${NPM_TOKEN}
  - pnpm config set @garmingo:registry=https://${CI_SERVER_HOST}/api/v4/packages/npm/
  - pnpm install --frozen-lockfile --prefer-offline

test:
  stage: test
  script:
    - pnpm test
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

publish:
  stage: publish
  needs: ["test"]
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - REGISTRY_URL="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/npm/"
    - pnpm install --no-frozen-lockfile --prefer-offline
    - pnpm run build
    - pnpm config set //${CI_SERVER_HOST}/api/v4/projects/${CI_PROJECT_ID}/packages/npm/:_authToken ${CI_JOB_TOKEN}
    - pnpm config set @garmingo:registry=${REGISTRY_URL}
    - pnpm publish --registry=${REGISTRY_URL} --no-git-checks
  artifacts:
    paths:
      - dist
    expire_in: 1 week
